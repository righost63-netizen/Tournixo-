<!-- ═══════════════════════════════════════════════════════════
     TOURNIXO SPLASH SCREEN — premium brand reveal
     Mounted only on index.html (root), so images/ resolves from root.
     ═══════════════════════════════════════════════════════════ -->
<div id="screen-splash" class="screen active splash">
    <!-- Ambient brand glows -->
    <div class="splash-glow splash-glow-a"></div>
    <div class="splash-glow splash-glow-b"></div>
    <div class="splash-grid"></div>

    <!-- Center brand lockup -->
    <div class="splash-center">
        <div class="splash-logo-ring">
            <img src="images/tournixo-logo.png" alt="Tournixo" class="splash-logo" draggable="false">
        </div>
        <h1 class="splash-title">Tournixo</h1>
        <p class="splash-tag">Host &amp; Join Custom Rooms</p>
    </div>

    <!-- Bottom loader -->
    <div class="splash-loader">
        <div class="spinner splash-spinner"></div>
        <span class="splash-loader-text">Entering the arena…</span>
    </div>
</div>
