<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Team - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/pages/my-team.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">
</head>

<body data-page="my-team">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- pages/my-team.html — Persistent squad roster (v7) -->
            <div class="page my-team-page" id="page-my-team">
                <div class="top-nav" style="justify-content:flex-start;gap:14px;">
                    <button class="back-btn" onclick="goBack('profile')">‹ Back</button>
                    <h1>My Team</h1>
                </div>

                <div class="scroll-area">
                    <!-- Join-mode banner (when opened from a tournament Join button) -->
                    <div id="myteam-join-banner" style="display:none;"></div>

                    <!-- Dynamic content renders here -->
                    <div id="myteam-content">
                        <div class="empty-state">
                            <div class="spinner"></div>
                        </div>
                    </div>

                    <div style="height:24px;"></div>
                </div>
            </div>

        </div>
    </div>

    <script type="module" src="../scripts/my-team.js"></script>
</body>

</html>
