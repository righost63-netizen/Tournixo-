<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tournaments - Tournixo</title>
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/components/bottom-nav.css">
    <link rel="stylesheet" href="../styles/components/skeleton-loader.css">
    <link rel="stylesheet" href="../styles/pages/tournaments.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="theme-color" content="#080808">
<!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">

</head>

<body data-page="tournaments">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- TOURNAMENTS TAB -->
            <div id="tab-tournaments" class="tab-panel active-tab" style="flex:1;flex-direction:column;overflow:hidden;">
                <div class="top-nav" style="justify-content:flex-start;gap:14px;">
                    <button class="back-btn" onclick="goBack('home')">‹ Back</button>
                    <h1>Tournaments</h1>
                </div>
                <!-- Search Box -->
                <div style="padding: 10px 16px 4px;">
                    <div class="input-group" style="height: 44px; margin-bottom: 8px; border-radius: 12px;">
                        <span class="input-icon">🔍</span>
                        <input id="tourn-search-input" type="text" placeholder="Search by tournament name..." oninput="onTournSearch(this.value)">
                    </div>
                </div>
                <!-- Filters -->
                <div class="filter-tabs" style="overflow-x: auto; scrollbar-width: none;">
                    <button class="filter-tab" onclick="setTournFilter('all',this)">All</button>
                    <button class="filter-tab active" onclick="setTournFilter('upcoming',this)">Upcoming</button>
                    <button class="filter-tab" onclick="setTournFilter('ongoing',this)">Ongoing</button>
                    <button class="filter-tab" onclick="setTournFilter('completed',this)">Completed</button>
                    <button class="filter-tab" onclick="setTournFilter('cancelled',this)">Cancelled</button>
                </div>
                <div class="scroll-area" id="tournaments-list"></div>
            </div>


        </div>
    </div>

    <script type="module" src="../scripts/tournaments.js"></script>
</body>

</html>
