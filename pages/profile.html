<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Profile - Tournixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/components/bottom-nav.css">
    <link rel="stylesheet" href="../styles/pages/profile.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="theme-color" content="#080808">
<!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">

</head>

<body data-page="profile">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- PROFILE TAB — Redesigned 3-section table border style -->
            <div id="tab-profile" class="tab-panel active-tab">
                <div class="scroll-area">
                    <!-- ── Top: avatar / name / chips ───────── -->
                    <div class="prf-top">
                        <div class="prf-avatar" id="profile-avatar-big">?</div>
                        <div class="prf-name" id="profile-name-big">Loading...</div>
                        <div class="prf-chip-row">
                            <div class="prf-chip" id="profile-uid-big">
                                <span class="prf-meta-icon">🎮</span>UID: —
                            </div>
                            <div class="prf-chip earn" id="profile-earn-big">
                                <span class="prf-meta-icon">💰</span>₹0 Earned
                            </div>
                        </div>
                    </div>
                    <!-- ── Section 1: Stats ─────────────────── -->
                    <div class="prf-sec-label">MY STATS</div>
                    <div class="prf-stats">
                        <div class="prf-stat-card">
                            <div class="prf-stat-ic">🏆</div>
                            <div>
                                <div class="prf-stat-num" id="prf-stat-tournaments">0</div>
                                <div class="prf-stat-lbl">Joined</div>
                            </div>
                        </div>
                        <div class="prf-stat-card">
                            <div class="prf-stat-ic">🥇</div>
                            <div>
                                <div class="prf-stat-num" id="prf-stat-wins">0</div>
                                <div class="prf-stat-lbl">Wins</div>
                            </div>
                        </div>
                        <div class="prf-stat-card prf-stat-card--wide">
                            <div class="prf-stat-ic">💰</div>
                            <div>
                                <div class="prf-stat-num" id="prf-stat-winning">₹0</div>
                                <div class="prf-stat-lbl">Winning Balance</div>
                            </div>
                        </div>
                    </div>
                    <!-- ── Section 2: Preferences ──────────── -->
                    <div class="prf-sec-label">PREFERENCES</div>
                    <div class="prf-card">
                        <div class="prf-row">
                            <div class="prf-row-ic">🔔</div>
                            <div class="prf-row-label">Notifications</div>
                            <div class="toggle" id="notif-toggle" role="switch" aria-checked="false" onclick="toggleNotifications(this)"></div>
                        </div>
                        <!-- v6.1: real PWA install (Chrome → Install app). Shown only
                             when the browser fires beforeinstallprompt. -->
                        <div class="prf-row tappable" id="install-app-row" style="display:none;" onclick="installTournixoApp()">
                            <div class="prf-row-ic">📲</div>
                            <div class="prf-row-label">Install App</div>
                            <div class="prf-chev">›</div>
                        </div>
                    </div>
                    <!-- ── Section 2b: Account ─────────────── -->
                    <div class="prf-sec-label">ACCOUNT</div>
                    <div class="prf-card">
                        <div class="prf-row tappable" onclick="openPage('accountSettings')">
                            <div class="prf-row-ic">⚙️</div>
                            <div class="prf-row-label">Account Settings</div>
                            <div class="prf-chev">›</div>
                        </div>
                    </div>
                    <!-- ── Section 3: App Links ────────────── -->
                    <div class="prf-sec-label">APP</div>
                    <div class="prf-card">
                        <div class="prf-row tappable" onclick="openPage('myTeam')">
                            <div class="prf-row-ic">🛡️</div>
                            <div class="prf-row-label">My Team</div>
                            <div class="prf-chev">›</div>
                        </div>
                        <div class="prf-row tappable" onclick="openPage('reportPlayer')">
                            <div class="prf-row-ic">🚨</div>
                            <div class="prf-row-label">Report Player</div>
                            <div class="prf-chev">›</div>
                        </div>
                        <div class="prf-row tappable" onclick="openPage('leaderboard')">
                            <div class="prf-row-ic">🏆</div>
                            <div class="prf-row-label">Leaderboard</div>
                            <div class="prf-chev">›</div>
                        </div>
                        <div class="prf-row tappable" onclick="openPage('results')">
                            <div class="prf-row-ic">📣</div>
                            <div class="prf-row-label">Results</div>
                            <div class="prf-chev">›</div>
                        </div>
                        <div class="prf-row tappable" onclick="openPage('terms')">
                            <div class="prf-row-ic">📋</div>
                            <div class="prf-row-label">Terms &amp; Conditions</div>
                            <div class="prf-chev">›</div>
                        </div>
                        <div class="prf-row tappable" onclick="openPage('helpSupport')">
                            <div class="prf-row-ic">❓</div>
                            <div class="prf-row-label">Help &amp; Support</div>
                            <div class="prf-chev">›</div>
                        </div>
                    </div>
                    <!-- ── Standalone logout (danger zone) ───────── -->
                    <button class="prf-logout-btn" onclick="confirmLogout()">
                        <span class="prf-logout-ic">🚪</span>
                        <span>Log Out</span>
                    </button>
                    <div class="prf-version">Tournixo v7.4</div>
                    <div style="height:20px;"></div>
                </div> <!-- scroll-area close -->
            </div> <!-- tab-profile close -->


        </div>
    </div>

    <script type="module" src="../scripts/profile.js"></script>
</body>

</html>
