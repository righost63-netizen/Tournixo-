<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Matches - Tournixo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/global.css">
    <link rel="stylesheet" href="../styles/components/toast.css">
    <link rel="stylesheet" href="../styles/components/confirm-dialog.css">
    <link rel="stylesheet" href="../styles/components/bottom-nav.css">
    <link rel="stylesheet" href="../styles/components/skeleton-loader.css">
    <link rel="stylesheet" href="../styles/pages/tournaments.css">
    <link rel="stylesheet" href="../styles/pages/matches.css">
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
    <meta name="theme-color" content="#080808">
<!-- modulepreload: warm the shared module graph during HTML parse -->
    <link rel="modulepreload" href="../scripts/app.js">
    <link rel="modulepreload" href="../scripts/state.js">
    <link rel="modulepreload" href="../scripts/cache.js">
    <link rel="modulepreload" href="../firebase/firebase-init.js">

</head>

<body data-page="matches">
    <div id="app">
        <div id="screen-main" class="screen active">

            <!-- MY MATCHES TAB -->
            <div id="tab-matches" class="tab-panel active-tab" style="flex:1;flex-direction:column;overflow:hidden;">
                <div class="top-nav">
                    <h1>My Matches</h1>
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" onclick="setMatchFilter('all',this)">All</button>
                    <button class="filter-tab" onclick="setMatchFilter('active',this)">Active</button>
                    <button class="filter-tab" onclick="setMatchFilter('completed',this)">Completed</button>
                </div>
                <div class="scroll-area" id="matches-list"></div>
            </div>


        </div>
    </div>

    <script type="module" src="../scripts/matches.js"></script>
</body>

</html>
