
name: Build TWA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          
      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          test -x "$JAVA_HOME/bin/java"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/platform-tools/adb"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager -perm -111 | head -n 1)"
          fi

          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"

          echo "Android SDK components verified."

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          bubblewrap updateConfig \
            --jdkPath="$JAVA_HOME" \
            --androidSdkPath="$ANDROID_HOME"

          cat "$HOME/.bubblewrap/config.json"

          bubblewrap doctor

      - name: Restore or create signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Set KEYSTORE_PASSWORD and KEY_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > android.keystore
            echo "KEYSTORE_RESTORED=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias tournixo \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KS_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Tournixo, OU=Tournixo, O=Tournixo, L=Kolkata, ST=West Bengal, C=IN"

            echo "KEYSTORE_RESTORED=false" >> "$GITHUB_ENV"
          fi

          keytool -list \
            -keystore android.keystore \
            -alias tournixo \
            -storepass "$KS_PASS"

      - name: Check TWA manifest
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f twa-manifest.json ]; then
            echo "::error::twa-manifest.json was not found in the repository root."
            exit 1
          fi

          node -e "JSON.parse(require('fs').readFileSync('twa-manifest.json','utf8')); console.log('TWA manifest JSON is valid.')"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail

          bubblewrap update --skipVersionUpgrade

      - name: Build signed APK and AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath="$GITHUB_WORKSPACE/android.keystore" \
            --signingKeyAlias="tournixo"

          echo "Searching for build outputs..."

          find . -type f \( \
            -name "*.apk" -o \
            -name "*.aab" \
          \) -not -path "./.git/*" -print

      - name: Generate assetlinks.json
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          FP="$(keytool -list -v \
            -keystore android.keystore \
            -alias tournixo \
            -storepass "$KS_PASS" |
            awk '/SHA256:/{print $2; exit}')"

          if [ -z "$FP" ]; then
            echo "::error::Could not read the SHA-256 certificate fingerprint."
            exit 1
          fi

          mkdir -p dist-assetlinks

          node -e '
            const fs = require("fs");
            const data = [{
              relation: ["delegate_permission/common.handle_all_urls"],
              target: {
                namespace: "android_app",
                package_name: "app.tournixo.twa",
                sha256_cert_fingerprints: [process.argv[1]]
              }
            }];
            fs.writeFileSync(
              "dist-assetlinks/assetlinks.json",
              JSON.stringify(data, null, 2) + "\n"
            );
          ' "$FP"

          cat dist-assetlinks/assetlinks.json

      - name: Upload APK, AAB and assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: tournixo-apk
          path: |
            **/*.apk
            **/*.aab
            dist-assetlinks/assetlinks.json
            !**/.git/**
            !**/node_modules/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload first signing key
        if: env.KEYSTORE_RESTORED == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tournixo-keystore-KEEP-FOREVER
          path: android.keystore
          if-no-files-found: error
          retention-days: 90
          
