# ── Tournixo TWA APK — GitHub Actions (Bubblewrap) ────────────────────
name: Build TWA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment for Bubblewrap
        run: |
          sudo chown -R $USER:$USER /usr/local/lib/android/sdk
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest /usr/local/lib/android/sdk/tools 2>/dev/null || true
          sudo ln -sf /usr/local/lib/android/sdk/cmdline-tools/latest/bin /usr/local/lib/android/sdk/bin 2>/dev/null || true
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at JDK + Android SDK
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "/usr/local/lib/android/sdk" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Restore or create signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PASS="${KS_PASS_SECRET:-tournixo12345}"
          KEYPASS="${KEY_PASS_SECRET:-tournixo12345}"
          echo "EFFECTIVE_KS_PASS=$PASS" >> "$GITHUB_ENV"
          echo "EFFECTIVE_KEY_PASS=$KEYPASS" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android.keystore
            echo "KEYSTORE_RESTORED=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore android.keystore -alias tournixo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$KEYPASS" \
              -dname "CN=Tournixo, OU=Tournixo, O=Tournixo, L=Kolkata, ST=West Bengal, C=IN"
            echo "KEYSTORE_RESTORED=false" >> "$GITHUB_ENV"
          fi

      - name: Generate/update Android project (non-interactive)
        run: |
          set -euo pipefail
          bubblewrap update --skipVersionUpgrade
          ls -la twa-manifest.json

      - name: Build signed APK + AAB (Bubblewrap / TWA)
        run: |
          set -euo pipefail
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$EFFECTIVE_KS_PASS"
          export BUBBLEWRAP_KEY_PASSWORD="$EFFECTIVE_KEY_PASS"
          yes y | script -qec "bubblewrap build --skipPwaValidation" /dev/null
          ls -lh ./*.apk ./*.aab 2>/dev/null || find . -maxdepth 4 \( -name "*.apk" -o -name "*.aab" \) -print

      - name: Make ready-to-use assetlinks.json
        run: |
          set -euo pipefail
          FP=$(keytool -list -v -keystore android.keystore -alias tournixo -storepass "$EFFECTIVE_KS_PASS" | grep 'SHA256:' | awk '{print $2}')
          test -n "$FP"
          mkdir -p dist-assetlinks
          printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"app.tournixo.twa","sha256_cert_fingerprints":["%s"]}}]\n' "$FP" > dist-assetlinks/assetlinks.json
          cat dist-assetlinks/assetlinks.json

      - name: Upload APK + AAB + assetlinks
        uses: actions/upload-artifact@v4
        with:
          name: tournixo-apk
          path: |
            *.apk
            *.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            dist-assetlinks/assetlinks.json
          if-no-files-found: error

      - name: Upload NEW keystore (শুধু প্রথমবার — চিরদিনের জন্য রেখে দাও!)
        if: env.KEYSTORE_RESTORED == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: tournixo-keystore-KEEP-FOREVER
          path: android.keystore
          if-no-files-found: error
